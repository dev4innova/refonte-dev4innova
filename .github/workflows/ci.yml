# Continuous integration (TASK-116). Every job must pass before merging into main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.11.32"
  GITLEAKS_VERSION: "8.24.3"
  GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"

jobs:
  commits:
    name: Commit conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint PR title (becomes the squash commit)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      - name: Lint commits of the PR
        # Dependabot bodies contain long release-note lines; its PR title is still linted.
        if: github.actor != 'dependabot[bot]'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dev4innova/web lint --max-warnings=0
      - run: pnpm -r typecheck
      - run: pnpm --filter @dev4innova/web test
      - run: pnpm --filter @dev4innova/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  web-e2e:
    name: Web E2E (responsive, accessibility, i18n)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Chromium and its system libraries are preinstalled: no `playwright install --with-deps`.
    # Keep the tag in sync with @playwright/test in apps/web/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    # The CMS pages (services, insights, portfolio, legal pages) read the API: run it with
    # its database, migrated (the migrations seed the five services).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dev4innova
          POSTGRES_PASSWORD: dev4innova
          POSTGRES_DB: dev4innova
        options: >-
          --health-cmd "pg_isready -U dev4innova -d dev4innova"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Start the API
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://dev4innova:dev4innova@postgres:5432/dev4innova
          REDIS_URL: redis://redis:6379/0
        run: |
          uv sync --frozen --no-dev
          uv run alembic upgrade head
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          uv run python -c "
          import time, urllib.request
          for _ in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('API not ready')
          "
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: pnpm e2e
      - name: Upload Playwright report (screenshots at 375, 768 and 1280 px)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14
      - name: API logs
        if: ${{ failure() }}
        run: cat "$RUNNER_TEMP/api.log"

  api:
    name: API (lint, typecheck, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dev4innova
          POSTGRES_PASSWORD: dev4innova
          POSTGRES_DB: dev4innova_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dev4innova -d dev4innova_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://dev4innova:dev4innova@localhost:5432/dev4innova_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  api-contract:
    name: API client up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: cd apps/api && uv sync --frozen
      - run: pnpm --filter @dev4innova/api-client generate
      - name: Fail if the generated client differs from the API
        run: |
          if ! git diff --exit-code -- packages/api-client; then
            echo "::error::packages/api-client is out of date. Run 'make client' and commit the result."
            exit 1
          fi

  security:
    # TASK-120: static analysis of the Python code (Bandit) and secret scanning of the whole
    # git history (gitleaks, .gitleaks.toml). ESLint security rules run in the Web job.
    name: Security (code and secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Bandit
        working-directory: apps/api
        run: |
          uv sync --frozen
          uv run bandit -q -c pyproject.toml -r app
      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks (full history)
        run: "\"$RUNNER_TEMP/gitleaks\" git . --redact --no-banner --exit-code 1"

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build backup image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/backup.Dockerfile
          push: false
