[project]
name = "dev4innova-api"
version = "0.1.0"
description = "DEV4INNOVA backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "pydantic-settings>=2.16",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "redis>=8.1",
    "pyjwt[crypto]>=2.15",
    "pydantic[email]>=2.14.3",
    "httpx>=0.28",
    "boto3>=1.40",
    "pillow>=11",
    "markdown-it-py>=4",
    "nh3>=0.3",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
    "ruff>=0.17",
    "mypy>=2.4",
    "moto[s3]>=5.1",
    "boto3-stubs[s3]>=1.40",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "S", "ASYNC", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["N999", "E501"]  # data migrations embed content

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
