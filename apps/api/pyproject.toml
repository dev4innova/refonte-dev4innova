[project]
name = "dev4innova-api"
version = "0.1.0"
description = "DEV4INNOVA backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "pydantic-settings>=2.16",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "redis>=8.1",
    "pyjwt[crypto]>=2.15",
    "pydantic[email]>=2.14.3",
    "httpx>=0.28",
    "boto3>=1.40",
    "pillow>=11",
    "markdown-it-py>=4",
    "nh3>=0.3",
    "python-multipart>=0.0.20",
    "anthropic>=1",
    "openai>=2",
    "google-genai>=1",
    "pypdf>=6",
    "python-docx>=1.2",
    "reportlab>=4.4",
    "argon2-cffi>=25.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
    "ruff>=0.17",
    "mypy>=2.4",
    "moto[s3]>=5.1",
    "boto3-stubs[s3]>=1.40",
    "types-reportlab>=5.1.0.20261104",
    "bandit[toml]>=1.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "S", "ASYNC", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["N999", "E501"]  # data migrations embed content
# Questionnaire and recommendation texts (FR/EN content, one sentence per line).
"app/modules/diagnostic/questionnaire.py" = ["E501"]
"app/modules/diagnostic/scoring.py" = ["E501"]
"app/modules/diagnostic/report_pdf.py" = ["E501"]  # report layout, one element per line
# French invoice texts (en dash, narrow no-break space) and document layout.
"app/modules/billing/*.py" = ["RUF001"]
"app/modules/billing/document_pdf.py" = ["RUF001", "E501"]
"app/modules/billing/router.py" = ["RUF001", "E501"]

[tool.bandit]
# Asserts only state invariants for the type checker; the images never run Python with -O.
skips = ["B101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
