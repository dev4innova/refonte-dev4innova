# Local stack: PostgreSQL, Redis, migrations, API, web.
# Usage from the repository root: `make up` (see infra/docker/README.md).
# Defaults are for local development only; override them in infra/docker/.env.
name: dev4innova

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dev4innova}:${POSTGRES_PASSWORD:-dev4innova}@postgres:5432/${POSTGRES_DB:-dev4innova}
  REDIS_URL: redis://redis:6379/0
  CORS_ALLOWED_ORIGINS: '["http://localhost:${WEB_PORT:-3000}"]'
  AUTH_ISSUER: ${AUTH_ISSUER:-}
  AUTH_AUDIENCE: ${AUTH_AUDIENCE:-}
  # The API is only reached through the web app here: trust its X-Forwarded-For.
  TRUST_FORWARDED_FOR: "true"
  MEDIA_S3_ENDPOINT_URL: http://minio:9000
  MEDIA_S3_BUCKET: dev4innova-media
  MEDIA_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-dev4innova}
  MEDIA_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-dev4innova-secret}
  # URL seen by browsers.
  MEDIA_PUBLIC_BASE_URL: http://localhost:${MINIO_PORT:-9000}/dev4innova-media

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev4innova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev4innova}
      POSTGRES_DB: ${POSTGRES_DB:-dev4innova}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for CMS media (ADR-0010). Console on :9001.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dev4innova}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev4innova-secret}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates the media bucket, readable by anyone (published website images).
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/dev4innova-media &&
        mc anonymous set download local/dev4innova-media
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dev4innova}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev4innova-secret}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # One-shot: applies Alembic migrations before the API starts.
  migrate:
    build:
      context: ../../apps/api
      dockerfile: ../../infra/docker/api.Dockerfile
    image: dev4innova/api:local
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: dev4innova/api:local
    environment: *api-env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    image: dev4innova/web:local
    environment:
      API_URL: http://api:8000
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      ALLOW_INDEXING: ${ALLOW_INDEXING:-false}
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:-}
      AUTH_PROJECT_ID: ${AUTH_AUDIENCE:-}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
